name: Release

# Publishes @codai/agentq on a v* tag with npm trusted publishing (OIDC) and provenance.
# No NPM_TOKEN secret. One-time prerequisite on npmjs.com, package @codai/agentq:
#   Settings -> Trusted publishing -> GitHub Actions -> repo dragos-catalin/agentq, workflow release.yml.
# npm only allows that after the package exists, so the very first version is published once
# by the owner (`npm login` then `pnpm run build && npm publish --access public`).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: npm >= 11.5 (trusted publishing)
        run: npm i -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: npm publish --access public --provenance
      - name: Verify on the registry
        run: |
          for i in 1 2 3 4 5 6; do
            v=$(npm view @codai/agentq version 2>/dev/null || true)
            [ "v$v" = "${GITHUB_REF_NAME}" ] && echo "published $v" && exit 0
            sleep 10
          done
          echo "registry does not show ${GITHUB_REF_NAME}"; exit 1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
